name: NEN weekly report

on:
  schedule:
    # 北京时间每周一 09:00 = UTC 周一 01:00（GitHub cron 有约 15 分钟级触发抖动）
    - cron: "0 1 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nen-weekly
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run weekly pipeline (retrieve -> process -> render)
        working-directory: pipeline
        env:
          NEN_WEEKLY_OUT: ../site
        run: |
          chmod +x run_weekly.sh
          ./run_weekly.sh

      - name: Commit new issue to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/ archive/
          if git diff --cached --quiet; then
            echo "No new issue output; nothing to commit."
          else
            git commit -m "weekly report $(date -d 'yesterday' +%F 2>/dev/null || date -v-1d +%F) [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
